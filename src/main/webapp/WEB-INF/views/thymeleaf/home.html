<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triviador Argentina - Lobby</title>
    <style>
        /* Estilos Generales y Fondo */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            background: gray;
        }


        /* Barra Superior (Header) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Botón Cerrar Sesión (Izquierda) */
        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .logout-btn:hover {
            background-color: #c0392b;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
        }

        /* Título Central */
        .game-title {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #74b9ff, 0 0 20px #74b9ff;
            color: #ffffff;
            margin: 0;
        }

        .game-title span {
            color: #74b9ff; /* Celeste para el toque argentino */
        }

        /* Perfil de Usuario (Derecha) */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #74b9ff;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #1a2a6c;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-weight: bold;
            font-size: 1rem;
        }

        .user-stats {
            font-size: 0.8rem;
            color: #dfe6e9;
        }

        /* Cuerpo Principal (Body/Lobby) */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        /* Botón Buscar Partida */
        .play-btn {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(9, 132, 227, 0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: inline-block;
        }

        .play-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(9, 132, 227, 0.8), 0 0 15px #fff;
        }

        .play-btn:active {
            transform: translateY(2px);
        }

        /* Otras opciones secundarias */
        .secondary-options {
            display: flex;
            gap: 15px;
        }

        .sec-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .sec-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #fff;
        }

        /* Footer / Decoración */
        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

<!-- BARRA SUPERIOR -->
<header>
    <!-- Izquierda: Desconectarse -->
    <button class="logout-btn" onclick="alert('Cerrando sesión...')">Salir</button>

    <!-- Centro: Nombre del Juego -->
    <h1 class="game-title">Triviador <span>Argentina</span></h1>

    <!-- Derecha: Perfil de Usuario -->
    <div class="user-profile">
        <div class="avatar">👨‍</div>
        <div class="user-info">
            <span class="username">CheJugador_10</span>
            <span class="user-stats">Nivel 15 • 1250 PTS</span>
        </div>
    </div>
</header>

<!-- CUERPO DEL LOBBY -->
<main>
    <!-- Botón Principal -->
    <a th:href="@{/lobby}" class="play-btn">¡Buscar Partida!</a>

    <!-- Otras Opciones del Lobby -->
    <div class="secondary-options">
        <button class="sec-btn" onclick="alert('Abriendo Tienda...')">Tienda</button>
        <button class="sec-btn" onclick="alert('Abriendo Clasificación...')">Ranking</button>
        <button class="sec-btn" onclick="alert('Abriendo Amigos...')">Amigos</button>
    </div>
</main>

<!-- PIE DE PÁGINA -->
<footer>
    &copy; 2026 Triviador Argentina - El juego de preguntas y estrategia.
</footer>


</body>
</html>
