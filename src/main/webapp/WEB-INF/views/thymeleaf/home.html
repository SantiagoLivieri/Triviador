<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <title>Triviador Argentina - Lobby</title>
   
</head>
<body>

<!-- BARRA SUPERIOR -->
<header>
    <!-- Izquierda: Desconectarse -->
    <a th:href="@{/logout}" class="logout-btn">Salir</a>

    <!-- Centro: Nombre del Juego -->
    <h1 class="game-title">Triviador <span>Argentina</span></h1>

    <!-- Derecha: Perfil de Usuario -->
    <div class="user-profile">
        <div class="avatar">👤</div>
        <div class="user-info">
            <span class="username" th:text="${usuario.nombreJugador}">Jugador</span>
            <span class="user-stats">Puntos: <span th:text="${usuario.puntaje}">0</span></span>
        </div>
    </div>
</header>

<!-- CUERPO DEL LOBBY -->
<main>
    <!-- Botón Principal -->
    <a th:href="@{/lobby}" class="play-btn">¡Iniciar Partida!</a>

    <!-- Otras Opciones del Lobby -->
    <div class="secondary-options">
        <button class="sec-btn" onclick="alert('Abriendo Tienda...')">Tienda</button>
        <button class="sec-btn" onclick="alert('Abriendo Clasificación...')">Ranking</button>
        <button class="sec-btn" onclick="alert('Abriendo Amigos...')">Amigos</button>
    </div>
</main>

<!-- PIE DE PÁGINA -->
<footer>
    &copy; 2026 Triviador Argentina - El juego de preguntas y estrategia.
</footer>


</body>
</html>
