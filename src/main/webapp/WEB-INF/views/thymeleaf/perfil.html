<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Triviador Argentina</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex items-center justify-center"
      style="background: radial-gradient(circle at top, #263b63, #111827 55%, #05070c);">

<div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md my-8">

  <div class="text-center mb-6">
    <h2 class="text-3xl font-bold text-blue-600">Mi perfil</h2>
    <p class="text-gray-500 text-sm mt-1">Datos de tu cuenta en Triviador Argentina</p>
  </div>

  <form th:action="@{/perfil/guardar}" method="POST" class="space-y-4">

    <div>
      <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
      <input type="text"
             id="nombre"
             name="nombre"
             th:value="${usuario.nombre}"
             required
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
    </div>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
      <input type="email"
             id="email"
             th:value="${usuario.email}"
             disabled
             class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500">
    </div>

    <div>
      <label for="nombreJugador" class="block text-sm font-medium text-gray-700 mb-1">Nombre de jugador</label>
      <input type="text"
             id="nombreJugador"
             name="nombreJugador"
             th:value="${usuario.nombreJugador}"
             required
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Puntaje</label>
      <p class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-700">
        <span th:text="${usuario.puntaje}">0</span> puntos
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
      <p class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-700"
         th:text="${usuario.rol.descripcion}">
        JUGADOR
      </p>
    </div>

    <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-sm mt-2">
      Guardar cambios
    </button>
  </form>

  <div class="text-center mt-6 text-sm text-gray-600">
    <a th:href="@{/home}" class="text-blue-600 font-medium hover:underline">Volver al inicio</a>
  </div>

</div>

</body>
</html>
