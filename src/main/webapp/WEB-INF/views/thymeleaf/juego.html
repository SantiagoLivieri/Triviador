  <style>
    html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100vw;
    height: 100vh;

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(circle at top, #263b63, #111827 55%, #05070c);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header{
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 5px;
      padding-right: 5px;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.25);
    }

    main{
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #game-title{
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #74b9ff, 0 0 20px #74b9ff;
      color: #ffffff;
      margin: 0;
    }

    #game-title span {
      color: #74b9ff;
    }

    #mapaYPuntos{
      display: flex;
      justify-content: space-around;
      width: 100%;
      height: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    #map{
      flex: 1;
      max-width: 100%;
      box-sizing: border-box;
      position: relative;
    }

    .jugadores {
      align-items: center;
      margin-left: 20px;
      position: absolute;

      top: 20px;

      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 10px;
      right: auto;
    }

    .jugador {
      border-radius: 16px;
      padding: 18px;
      min-width: 180px;
      text-align: center;
      color: white;
    }

    #nombreDeJugador {
      margin: 0 0 8px;
      color: white;
    }

    #puntaje{
      color: white;
    }

    .jugador-rojo {
      background: #dc2626;
      border: 5px solid #F95834;
    }

    .jugador-azul {
      background: #2563eb;
      border: 5px solid #4077ED;
    }

    .jugador-verde {
      background: #16a34a;
      border: 5px solid #19B853;
    }

    #InfoDerecha{
      margin-left: 20px;
      position: absolute;
      top: 20px;
      right: 20px;

      z-index: 1000;
      gap: 10px;
      left: auto;
      display: flex;
      flex-direction: column;
    }


    #turnoYTimer {
      background: radial-gradient(circle at top, #263b63, #111827 55%, #05070c);
      gap: 10px;
      border-radius: 16px;
      min-width: 180px;
      width: 22em;
      padding: 18px;
      align-items: center;
      display: flex;
      flex-direction: column;
    }
    
    
    #timerBox{
      text-align: center;
      font-size: 1.5rem; 
      color: #ff3a1e; 
      font-weight: bold;
      display: flex;
    }

    .turno {
      text-align: center;
      font-size: 1.4rem;
      color: #efb810;
    }

    .mensaje {
      max-width: 700px;
      margin: 0 auto 25px;
      padding: 14px;
      border-radius: 12px;
      background: rgb(26, 25, 25);
      text-align: center;
      font-weight: bold;
    }

    .tablero {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }

    /*.provincia {

    @media (max-width: 900px) {
      .tablero {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 560px) {
      .tablero {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1 id="game-title">Triviador <span>Argentina</span></h1>
  </header>

  <main>

    <!--Seccion de mapas y puntaje-->

    <section id="mapaYPuntos">

      <div id="map">
        <!--Nombre de provincias-->
        <div id="info-provincia"></div>

        <!--nombre de jugadores y puntaje-->
        <div class="jugadores">
          <article class="jugador" 
                    th:each="jugador : ${jugadores}"
                    th:classappend="${' jugador-' + #strings.toLowerCase(jugador.color)}">
            <h1 id="nombreDeJugador" th:text="${jugador.nombre}">Jugador</h1>
            <h2 id="puntaje">Puntaje: <strong th:text="${jugador.puntaje}">0</strong></h2>
          </article>
        </div>

        <!--turnos timer y mensaje-->
          <section id="InfoDerecha">
            <article id="turnoYTimer">
              <div class="turno">
                Turno actual:
                <strong th:text="${jugadorActual != null ? jugadorActual.nombre : 'Sin jugadores'}"></strong>
              </div>
              <div id="timerBox">
                Tiempo restante: <span id="timer">30</span>s
              </div>
            </article>
            <div
            class="mensaje"
            th:if="${mensajeResultado != null}"
            th:text="${mensajeResultado}">
            </div>
          </section>

      </div>
    </section>

    <!--Las provincias en botones - actualmente invisible - no borrar-->
    <section class="tablero">
      <form
          class="provincia-form"
          th:each="provincia : ${provincias}"
          th:action="@{/seleccionar-provincia}"
          method="post">

        <input type="hidden" name="partidaId" th:value="${partida.id}">
        
        <input type="hidden" name="idProvincia" th:value="${provincia.id}">

        <button
            type="submit"
            class="provincia"
            th:attr="data-id=${provincia.id}, 
            data-nombre=${provincia.nombre}"
            th:classappend="${
              provincia.idJugadorDuenio == null
                ? ' provincia-neutral'
                : (jugadores.size() > 0 and provincia.idJugadorDuenio == jugadores[0].id
                    ? ' provincia-rojo'
                    : (jugadores.size() > 1 and provincia.idJugadorDuenio == jugadores[1].id
                        ? ' provincia-azul'
                        : (jugadores.size() > 2 and provincia.idJugadorDuenio == jugadores[2].id
                            ? ' provincia-verde'
                            : ' provincia-neutral')))
            }">

          <span class="provincia-nombre" th:text="${provincia.nombre}">Provincia</span>

          <span class="provincia-puntos">
            Puntos:
            <span th:text="${provincia.puntos}">0</span>
          </span>
        </button>
      </form>
    </section>
  </main>
    <!--inicia leaflet-->
    <script th:src="@{/js/leaflet.js}"></script>

    <!--carga el mapa-->
    <script th:src="@{/js/mapa.js}"></script>

  <script th:inline="javascript">
    
  const partidaId = /*[[${partida.id}]]*/ 0;
      const inicioEtapaStr = /*[[${partida.inicioEtapa.toString()}]]*/ '';
      const inicioTurno = new Date(inicioEtapaStr).getTime();
      const DURACION_TURNO_MS = 30 * 1000; 
      const display = document.getElementById('timer');

      function actualizarCronometro() {
          const ahora = new Date().getTime();
          const tiempoTranscurrido = ahora - inicioTurno;
          const tiempoRestante = Math.max(0, Math.round((DURACION_TURNO_MS - tiempoTranscurrido) / 1000));

          if (display) {
              display.textContent = tiempoRestante;
          }
          if (tiempoRestante <= 0) {
              clearInterval(cronometro);
              forzarTiempoAgotado();
          }
      }

      actualizarCronometro(); 
      
      const cronometro = setInterval(actualizarCronometro, 1000);

      function forzarTiempoAgotado() {
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = '/spring/juego/tiempo-agotado';

          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'partidaId';
          input.value = partidaId;

          form.appendChild(input);
          document.body.appendChild(form);
          form.submit(); 
      }
  </script>
</body>
</html>
