<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <title>Triviador Argentina - Juego</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #263b63, #111827 55%, #05070c);
      color: white;
      min-height: 100vh;
      padding: 30px;
    }

    h1 {
      color: #74b9ff;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 10px #74b9ff;
    }

    .jugadores {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 25px 0 35px;
      flex-wrap: wrap;
    }

    .jugador {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 18px;
      min-width: 180px;
      text-align: center;
    }

    .jugador h2 {
      margin: 0 0 8px;
      color: white;
    }

    .tablero {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }

    .provincia {
      min-height: 82px;
      border: none;
      border-radius: 14px;
      padding: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .provincia:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55);
    }

    .provincia-neutral {
      background: #374151;
    }

    .provincia-rojo {
      background: #dc2626;
    }

    .provincia-azul {
      background: #2563eb;
    }

    .provincia-verde {
      background: #16a34a;
    }

    .provincia-nombre {
      display: block;
      font-size: 0.95rem;
    }

    .provincia-puntos {
      display: block;
      margin-top: 6px;
      font-size: 0.8rem;
      opacity: 0.85;
    }

    .turno {
  text-align: center;
  font-size: 1.4rem;
  margin-bottom: 20px;
  color: #f6d36b;
}

.mensaje {
  max-width: 700px;
  margin: 0 auto 25px;
  padding: 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.12);
  text-align: center;
  font-weight: bold;
}

.provincia-form {
  margin: 0;
}

.provincia {
  width: 100%;
}

    @media (max-width: 900px) {
      .tablero {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 560px) {
      .tablero {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<h1>Triviador Argentina</h1>

<div class="turno">
  Turno actual:
  <strong th:text="${jugadorActual != null ? jugadorActual.nombre : 'Sin jugadores'}"></strong>
</div>

<div style="text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: #ff7675; font-weight: bold;">
  Tiempo restante: <span id="timer">30</span>s
</div>

<div
    class="mensaje"
    th:if="${mensajeResultado != null}"
    th:text="${mensajeResultado}">
</div>

<section class="jugadores">
  <article class="jugador" th:each="jugador : ${jugadores}">
    <h2 th:text="${jugador.nombre}">Jugador</h2>
    <p>
      Color:
      <strong th:text="${jugador.color}">Color</strong>
    </p>
    <p>
      Puntaje:
      <strong th:text="${jugador.puntaje}">0</strong>
    </p>
  </article>
</section>

<section class="tablero">
  <form
      class="provincia-form"
      th:each="provincia : ${provincias}"
      th:action="@{/seleccionar-provincia}"
      method="post">

    <input type="hidden" name="partidaId" th:value="${partida.id}">
    
    <input type="hidden" name="idProvincia" th:value="${provincia.id}">

    <button
        type="submit"
        class="provincia"
        th:classappend="${
          provincia.idJugadorDuenio == null
            ? ' provincia-neutral'
            : (jugadores.size() > 0 and provincia.idJugadorDuenio == jugadores[0].id
                ? ' provincia-rojo'
                : (jugadores.size() > 1 and provincia.idJugadorDuenio == jugadores[1].id
                    ? ' provincia-azul'
                    : (jugadores.size() > 2 and provincia.idJugadorDuenio == jugadores[2].id
                        ? ' provincia-verde'
                        : ' provincia-neutral')))
        }">

      <span class="provincia-nombre" th:text="${provincia.nombre}">Provincia</span>

      <span class="provincia-puntos">
        Puntos:
        <span th:text="${provincia.puntos}">0</span>
      </span>
    </button>
  </form>
</section>
<script th:inline="javascript">
  
const partidaId = /*[[${partida.id}]]*/ 0;
    const inicioEtapaStr = /*[[${partida.inicioEtapa.toString()}]]*/ '';
    const inicioTurno = new Date(inicioEtapaStr).getTime();
    const DURACION_TURNO_MS = 30 * 1000; 
    const display = document.getElementById('timer');

    function actualizarCronometro() {
        const ahora = new Date().getTime();
        const tiempoTranscurrido = ahora - inicioTurno;
        const tiempoRestante = Math.max(0, Math.round((DURACION_TURNO_MS - tiempoTranscurrido) / 1000));

        if (display) {
            display.textContent = tiempoRestante;
        }
        if (tiempoRestante <= 0) {
            clearInterval(cronometro);
            forzarTiempoAgotado();
        }
    }

    actualizarCronometro(); 
    
    const cronometro = setInterval(actualizarCronometro, 1000);

    function forzarTiempoAgotado() {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/spring/juego/tiempo-agotado';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'partidaId';
        input.value = partidaId;

        form.appendChild(input);
        document.body.appendChild(form);
        form.submit(); 
    }
</script>
</body>
</html>
