<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TallerWebI</title>
    <!-- Tailwind CSS desde CDN para el diseño rápido -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">

    <!-- Encabezado -->
    <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-gray-800">Bienvenido</h2>
        <p class="text-gray-500 text-sm mt-1">Ingresa tus credenciales para acceder</p>
    </div>

    <!-- Mensaje de Error (Se muestra si el controlador envía un atributo 'error') -->
    <!-- Si usas Thymeleaf, podés usar: th:if="${error != null}" -->
    <!-- Si usas JSP clásico, podés usar: c:if test="${not empty error}" -->
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm hidden" id="error-box">
        <span class="font-medium">Error:</span> Email o contraseña incorrectos.
    </div>

    <!-- Formulario -->
    <!-- Nota: El 'action' debe coincidir con el @RequestMapping/@PostMapping de tu ControladorLogin -->
    <form th:action="@{/validar-login}" method="POST" th:object="${datosLogin}" class="space-y-4">

        <!-- Campo Email -->
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input th:field="*{email}" type="email"
                   id="email"
                   name="email"
                   required
                   placeholder="ejemplo@correo.com"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>

        <!-- Campo Password -->
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input th:field="*{password}" type="password"
                   id="password"
                   name="password"
                   required
                   placeholder="••••••••"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>

        <!-- Botón de Envío -->
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-sm mt-2">
            Ingresar
        </button>
        <p th:if="${error != null}" th:text="${error}"></p>
    </form>

    <!-- Registro -->
    <div class="text-center mt-6 text-sm text-gray-600">
        ¿No tienes una cuenta?
        <a th:href="@{/registro}" class="text-blue-600 font-medium hover:underline">Regístrate aquí</a>
    </div>

</div>

</body>
</html>
