<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <title>Pregunta - Triviador Argentina</title>

  <link rel="stylesheet" th:href="@{/css/pregunta.css}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    .alert {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .feedback-correcto-overlay,
    .feedback-incorrecto-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background-color: rgba(0, 0, 0, 0.75);
    }

    .feedback-correcto-mensaje,
    .feedback-incorrecto-mensaje {
      padding: 40px 60px;
      border-radius: 20px;

      font-size: 3rem;
      font-weight: 700;
      text-align: center;
    }

    .feedback-correcto-mensaje {
      border: 4px solid #28a745;
      background-color: #d4edda;
      color: #155724;

      box-shadow: 0 0 35px rgba(40, 167, 69, 0.8);
    }

    .feedback-incorrecto-mensaje {
      border: 4px solid #dc3545;
      background-color: #f8d7da;
      color: #721c24;

      box-shadow: 0 0 35px rgba(220, 53, 69, 0.8);
    }

    .feedback-incorrecto-mensaje span {
      display: block;
      margin-top: 12px;
      font-size: 1.4rem;
    }

    .feedback-provincia-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0, 0, 0, 0.8);
}

.feedback-provincia-mensaje {
  min-width: 420px;
  max-width: 700px;
  padding: 45px 60px;
  border: 5px solid #ffd700;
  border-radius: 24px;

  background: linear-gradient(135deg, #fff7cc, #ffe58a);
  color: #5c4300;

  text-align: center;
  box-shadow: 0 0 40px rgba(255, 215, 0, 0.65);
}

.feedback-provincia-titulo {
  font-size: 3.2rem;
  font-weight: 800;
  margin-bottom: 14px;
  text-transform: uppercase;
}

.feedback-provincia-subtitulo {
  font-size: 1.5rem;
  font-weight: 600;
  line-height: 1.4;
}
      .abandonar-partida-form {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .btn-abandonar-partida {
      padding: 10px 18px;
      border: 2px solid #dc3545;
      border-radius: 10px;

      background-color: transparent;
      color: #dc3545;

      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;

      cursor: pointer;
      transition:
        background-color 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .btn-abandonar-partida:hover {
      background-color: #dc3545;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-abandonar-partida:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>

<body>

  <!-- Evita mostrar simultáneamente el cartel verde detrás del dorado -->
  <div
    th:if="${feedbackCorrecto == true and feedbackProvinciaGanada != true}"
    class="feedback-correcto-overlay">
    
    <div class="feedback-correcto-mensaje">
      ¡RESPUESTA CORRECTA!
    </div>
  </div>

  <!-- Feedback de respuesta incorrecta -->
  <div
    th:if="${feedbackIncorrecto}"
    class="feedback-incorrecto-overlay"
  >
    <div class="feedback-incorrecto-mensaje">
      ¡RESPUESTA INCORRECTA!

      <span>
        Finaliza el turno
      </span>
    </div>
  </div>

  <!--
    Después de mostrar durante un segundos el feedback incorrecto,
    JavaScript envía este formulario para avanzar el turno.
  -->
  <form
    id="continuarFeedbackIncorrectoForm"
    th:if="${feedbackIncorrecto}"
    th:action="@{/disputa/continuar-feedback-incorrecto}"
    method="post"
    style="display: none;"
  >
    <input
      type="hidden"
      name="partidaId"
      th:value="${partidaId}"
    >
  </form>

  <div
  th:if="${feedbackProvinciaGanada}"
  class="feedback-provincia-overlay"
  >
  <div class="feedback-provincia-mensaje">
    <div class="feedback-provincia-titulo">
      ¡PROVINCIA GANADA!
    </div>

    <div
      class="feedback-provincia-subtitulo"
      th:text="${mensajeVictoria != null ? mensajeVictoria : 'Conquistaste una nueva provincia'}"
    >
      Conquistaste una nueva provincia
    </div>
  </div>
</div>


  <div class="game-container">
        <form
      class="abandonar-partida-form"
      th:action="@{/juego/partida/{id}/abandonar(
        id=${partidaId}
      )}"
      method="post"
      onsubmit="return confirm(
        '¿Seguro que querés abandonar la partida? Perderás 20 XP.'
      );"
    >
      <button
        type="submit"
        class="btn-abandonar-partida"
        th:disabled="${feedbackCorrecto == true
          or feedbackIncorrecto == true
          or feedbackProvinciaGanada == true}"
      >
        Abandonar partida
      </button>
    </form>
    <div class="game-header">

      <div class="info-badge">
        Provincia:

        <strong th:text="${provincia.nombre}">
          La Pampa
        </strong>
      </div>

      <div class="timer-container">
        Tiempo restante
        <br>

        <span id="timer">33</span>s
      </div>

      <div class="info-badge">
        Jugador:

        <strong
          th:text="${jugadorActual != null
            ? jugadorActual.nombre
            : 'Sin jugador'}"
        >
          Jugador
        </strong>
      </div>

    </div>

    <div
      th:if="${mensajeComodin}"
      class="alert alert-success"
      th:text="${mensajeComodin}"
    >
    </div>

    <div
      th:if="${errorComodin}"
      class="alert alert-danger"
      th:text="${errorComodin}"
    >
    </div>

    <h3
      class="question"
      th:text="${pregunta != null
        ? pregunta.enunciado
        : 'No llegó pregunta'}"
    >
    </h3>

    <form
      th:action="@{/disputa/responder-provincia}"
      method="post"
    >
      <input
        type="hidden"
        name="partidaId"
        th:value="${partidaId}"
      >

      <input
        type="hidden"
        name="idProvincia"
        th:value="${provincia.id}"
      >

      <input
        type="hidden"
        name="idPregunta"
        th:value="${pregunta.id}"
      >

      <div class="options-grid">

        <label
          class="option-card"
          th:each="opcion : ${opciones}"
        >
          <input
            type="radio"
            name="respuesta"
            th:value="${opcion}"
            th:disabled="${feedbackCorrecto == true or feedbackIncorrecto == true or feedbackProvinciaGanada == true}"
            required
          >

          <span
            class="option-text"
            th:text="${opcion}"
          >
            Opción de muestra
          </span>
        </label>

      </div>

      <button
        type="submit"
        class="submit-btn"
        th:disabled="${feedbackCorrecto == true or feedbackIncorrecto == true or feedbackProvinciaGanada == true}">
        Responder
      </button>
    </form>

    <div class="jokers-section">

      <div class="jokers-title">
        Comodines Disponibles
      </div>

      <div class="jokers-container">

        <button
          type="button"
          class="joker-btn joker-5050"
          onclick="usarComodin('ELIMINAR_2')"
          th:disabled="${feedbackCorrecto == true or feedbackIncorrecto == true}"
        >
          <span class="joker-icon">✂️</span>

          Eliminar dos respuestas incorrectas
        </button>

        <button
          type="button"
          class="joker-btn joker-double"
          onclick="usarComodin('DOBLE_CHANCE')"
          th:disabled="${feedbackCorrecto == true or feedbackIncorrecto == true}"
        >
          <span class="joker-icon">🛡️</span>

          Doble chance
        </button>

        <button
          type="button"
          class="joker-btn joker-skip"
          onclick="usarComodin('PASAR_PREGUNTA')"
          th:disabled="${feedbackCorrecto == true or feedbackIncorrecto == true}"
        >
          <span class="joker-icon">⏩</span>

          Pasar pregunta
        </button>

      </div>
    </div>

  </div>

  <script th:inline="javascript">
    const partidaId = /*[[${partidaId}]]*/ 0;

    const feedbackCorrecto =
      /*[[${feedbackCorrecto != null ? feedbackCorrecto : false}]]*/ false;

    const feedbackIncorrecto =
      /*[[${feedbackIncorrecto != null ? feedbackIncorrecto : false}]]*/ false;

      const feedbackProvinciaGanada =
      /*[[${feedbackProvinciaGanada != null ? feedbackProvinciaGanada : false}]]*/ false;

    const destinoFeedback =
      /*[[${destinoFeedback != null ? destinoFeedback : ''}]]*/ '';

    const urlProximaPregunta =
      /*[[@{/disputa/pregunta-actual(partidaId=${partidaId})}]]*/ '';

    const urlTablero =
      /*[[@{/juego/partida/{id}(id=${partidaId})}]]*/ '';

    const urlResultados =
      /*[[@{/juego/partida/resultados/{id}(id=${partidaId})}]]*/ '';

    const inicioEtapaStr =
      /*[[${partida.inicioEtapa.toString()}]]*/ '';

    const inicioTurno = new Date(inicioEtapaStr).getTime();

    const DURACION_TURNO_MS = 33 * 1000;

    const display = document.getElementById('timer');

    function actualizarCronometro() {
      const ahora = new Date().getTime();

      const tiempoTranscurrido =
        ahora - inicioTurno;

      const tiempoRestante = Math.max(
        0,
        Math.round(
          (DURACION_TURNO_MS - tiempoTranscurrido) / 1000
        )
      );

      if (display) {
        display.textContent = tiempoRestante;

        if (tiempoRestante <= 10) {
          display.classList.add('timer-critical');
          display.style.color = 'red';
        } else if (tiempoRestante <= 15) {
          display.style.color = 'orange';
        } else {
          display.style.color = 'green';
        }
      }

      if (
        tiempoRestante <= 0 &&
        !feedbackCorrecto &&
        !feedbackIncorrecto &&
        !feedbackProvinciaGanada
      ) {
        clearInterval(cronometro);
        forzarTiempoAgotado();
      }
    }

    /*
      El intervalo se crea antes de ejecutar manualmente
      actualizarCronometro(), para que clearInterval()
      siempre reciba una referencia válida.
    */
    const cronometro = setInterval(
      actualizarCronometro,
      1000
    );

    actualizarCronometro();

    /*
      Respuesta correcta:
      espera dos segundos y continúa al destino correspondiente.
    */
    if (feedbackCorrecto || feedbackProvinciaGanada) {
      setTimeout(function () {
        const ahora = new Date().getTime();

        const tiempoAgotado =
          ahora - inicioTurno >= DURACION_TURNO_MS;

        /*
          Si correspondía otra pregunta pero el tiempo terminó
          durante los dos segundos de feedback, finaliza el turno.
        */
        if (
          destinoFeedback === 'PREGUNTA' &&
          tiempoAgotado
        ) {
          forzarTiempoAgotado();
          return;
        }

        if (destinoFeedback === 'PREGUNTA') {
          window.location.replace(urlProximaPregunta);
          return;
        }

        if (destinoFeedback === 'RESULTADOS') {
          window.location.replace(urlResultados);
          return;
        }

        window.location.replace(urlTablero);
      }, 1000);
    }

    /*
      Respuesta incorrecta:
      espera dos segundos y envía el formulario que avanza el turno.
    */
    if (feedbackIncorrecto) {
      setTimeout(function () {
        const formulario =
          document.getElementById(
            'continuarFeedbackIncorrectoForm'
          );

        if (formulario) {
          formulario.submit();
        }
      }, 1000);
    }

    function forzarTiempoAgotado() {
      const form = document.createElement('form');

      form.method = 'POST';

      form.action =
        /*[[@{/juego/tiempo-agotado}]]*/
        '/juego/tiempo-agotado';

      const input = document.createElement('input');

      input.type = 'hidden';
      input.name = 'partidaId';
      input.value = partidaId;

      form.appendChild(input);

      document.body.appendChild(form);

      form.submit();
    }

    function usarComodin(tipo) {
      /*
        Aunque los botones quedan deshabilitados desde Thymeleaf,
        también bloqueamos la ejecución por seguridad.
      */
      if (feedbackCorrecto || feedbackIncorrecto  || feedbackProvinciaGanada) {
        return;
      }

      const form = document.createElement('form');

      form.method = 'POST';

      form.action =
        /*[[@{/disputa/usar-comodin}]]*/
        '/disputa/usar-comodin';

      const inputTipo = document.createElement('input');

      inputTipo.type = 'hidden';
      inputTipo.name = 'tipoComodin';
      inputTipo.value = tipo;

      const inputPartida = document.createElement('input');

      inputPartida.type = 'hidden';
      inputPartida.name = 'partidaId';
      inputPartida.value = partidaId;

      form.appendChild(inputTipo);
      form.appendChild(inputPartida);

      document.body.appendChild(form);

      form.submit();
    }
  </script>

  <script>
    history.pushState(null, '', location.href);

    window.addEventListener('popstate', function () {
      location.replace(location.href);
    });
  </script>

</body>

</html>
