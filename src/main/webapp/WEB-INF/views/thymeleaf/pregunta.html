<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Pregunta - Triviador Argentina</title>
  <link rel="stylesheet" th:href="@{/css/pregunta.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    .alert { padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-weight: bold; }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>

<body>

<div class="game-container">

  <div class="game-header">
    <div class="info-badge">
      Provincia: <strong th:text="${provincia.nombre}">La Pampa</strong>
    </div>

    <div class="timer-container">
      Tiempo restante<br>
      <span id="timer">30</span>s
    </div>

    <div class="info-badge">
      Jugador: <strong th:text="${jugadorActual != null ? jugadorActual.nombre : 'Sin jugador'}">Jugador</strong>
    </div>
  </div>

  <div th:if="${mensajeComodin}" class="alert alert-success" th:text="${mensajeComodin}"></div>
  <div th:if="${errorComodin}" class="alert alert-danger" th:text="${errorComodin}"></div>

  <h3 class="question" th:text="${pregunta != null ? pregunta.enunciado : 'No llegó pregunta'}">
  </h3>

  <form th:action="@{/disputa/responder-provincia}" method="post">
    <input type="hidden" name="partidaId" th:value="${partidaId}">
    <input type="hidden" name="idProvincia" th:value="${provincia.id}">
    <input type="hidden" name="idPregunta" th:value="${pregunta.id}">

    <div class="options-grid">
      <label class="option-card" th:each="opcion : ${opciones}">
        <input type="radio" name="respuesta" th:value="${opcion}" required>
        <span class="option-text" th:text="${opcion}">Opción de muestra</span>
      </label>
    </div>

    <button type="submit" class="submit-btn">
      Responder
    </button>
  </form>
  
  <div class="jokers-section">
    <div class="jokers-title">Comodines Disponibles</div>
    <div class="jokers-container">

      <button type="button" class="joker-btn joker-5050" onclick="usarComodin('ELIMINAR_2')">
        <span class="joker-icon">✂️</span>
        Eliminar dos respuestas incorrectas
      </button>

      <button type="button" class="joker-btn joker-double" onclick="usarComodin('DOBLE_CHANCE')">
        <span class="joker-icon">🛡️</span>
        Doble chance
      </button>

      <button type="button" class="joker-btn joker-skip" onclick="usarComodin('PASAR_PREGUNTA')">
        <span class="joker-icon">⏩</span>
        Pasar pregunta
      </button>

    </div>
  </div>
</div>

<script th:inline="javascript">
  const partidaId = /*[[${partidaId}]]*/ 0;
  const inicioEtapaStr = /*[[${partida.inicioEtapa.toString()}]]*/ '';
  const inicioTurno = new Date(inicioEtapaStr).getTime();
  const DURACION_TURNO_MS = 30 * 1000;
  const display = document.getElementById('timer');

  function actualizarCronometro() {
    const ahora = new Date().getTime();
    const tiempoTranscurrido = ahora - inicioTurno;
    const tiempoRestante = Math.max(0, Math.round((DURACION_TURNO_MS - tiempoTranscurrido) / 1000));

    if (display) {
      display.textContent = tiempoRestante;

      if (tiempoRestante <= 10) {
        display.classList.add('timer-critical');
      }
    }
    if (tiempoRestante <= 0) {
      clearInterval(cronometro);
      forzarTiempoAgotado();
    }
  }
  actualizarCronometro();

  const cronometro = setInterval(actualizarCronometro, 1000);

  function forzarTiempoAgotado() {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = /*[[@{/juego/tiempo-agotado}]]*/ '/juego/tiempo-agotado';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'partidaId';
    input.value = partidaId;

    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
  }

  function usarComodin(tipo) {
    const form = document.createElement('form');
    form.method = 'POST';
   
    form.action = /*[[@{/disputa/usar-comodin}]]*/ '/disputa/usar-comodin';

    const inputTipo = document.createElement('input');
    inputTipo.type = 'hidden';
    inputTipo.name = 'tipoComodin'; 
    inputTipo.value = tipo;

    const inputPartida = document.createElement('input');
    inputPartida.type = 'hidden';
    inputPartida.name = 'partidaId';
    inputPartida.value = partidaId;

    form.appendChild(inputTipo);
    form.appendChild(inputPartida);
    document.body.appendChild(form);
    form.submit();
  }
</script>
</body>

</html>
